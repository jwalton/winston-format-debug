name: GitHub CI
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-versions: [22.x, 24.x, 26.x, lts]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - name: test
        run: npm test
